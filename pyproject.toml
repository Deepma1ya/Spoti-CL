[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spoti-cl"
version = "0.1.0"
description = "Spoti-CL - download and stream Spotify tracks, albums and playlists as high quality audio, without a Spotify client id."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Deepma1ya" }]
keywords = ["spotify", "yt-dlp", "downloader", "discord", "music", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "yt-dlp>=2024.1.1",
  "httpx>=0.27",
  "mutagen>=1.46",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
spoti-cl = "spoti_cl.cli:main"
spotidl = "spoti_cl.cli:main"

[project.urls]
Homepage = "https://github.com/Deepma1ya/Spoti-CL"

[tool.hatch.build.targets.wheel]
packages = ["src/spoti_cl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
